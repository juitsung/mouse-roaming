[workspace]
resolver = "2"
members = [
    "crates/mouseroaming-proto",
    "crates/mouseroaming-net",
    "crates/mouseroaming-os",
    "crates/mouseroaming-core",
    "crates/mouseroaming-app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
arboard = "3"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
directories = "5"
eframe = "0.29"
hex = "0.4"
hostname = "0.4"
if-addrs = "0.13"
mdns-sd = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.19"
uuid = { version = "1", features = ["v4", "serde"] }

# Platform-specific
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }
core-foundation = "0.10"
core-graphics = "0.24"

# Internal crates
mouseroaming-proto = { path = "crates/mouseroaming-proto" }
mouseroaming-net = { path = "crates/mouseroaming-net" }
mouseroaming-os = { path = "crates/mouseroaming-os" }
mouseroaming-core = { path = "crates/mouseroaming-core" }
